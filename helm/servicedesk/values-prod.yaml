replicaCount: 3

backend:
  replicas: 3
  resources:
    requests:
      cpu: 200m
      memory: 384Mi
    limits:
      cpu: 1000m
      memory: 768Mi

frontend:
  replicas: 3

postgres:
  persistence:
    enabled: true
    size: 5Gi

ingress:
  enabled: true
  className: nginx
  host: servicedesk.local

hpa:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

monitoring:
  serviceMonitor:
    enabled: true
