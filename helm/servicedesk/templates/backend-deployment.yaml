apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "servicedesk.fullname" . }}-backend
  labels:
    {{- include "servicedesk.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ include "servicedesk.backend.replicas" . }}
  selector:
    matchLabels:
      {{- include "servicedesk.backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "servicedesk.labels" . | nindent 8 }}
        {{- include "servicedesk.backend.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/postgres.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.postgres.enabled }}
      initContainers:
        - name: wait-for-postgres
          image: {{ .Values.postgres.image }}
          imagePullPolicy: {{ .Values.postgres.pullPolicy }}
          command:
            - sh
            - -c
            - until pg_isready -h {{ include "servicedesk.postgres.host" . }} -p {{ .Values.postgres.port }} -U {{ .Values.postgres.username }}; do echo waiting for postgres; sleep 2; done
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      {{- end }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image }}:{{ .Values.backend.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.backend.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.port }}
          env:
            - name: APP_NAME
              value: {{ .Values.backend.appName | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "servicedesk.postgres.secretName" . }}
                  key: database-url
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.backend.securityContext | nindent 12 }}
