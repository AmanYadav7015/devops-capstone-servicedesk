apiVersion: v1
kind: Service
metadata:
  name: {{ include "servicedesk.fullname" . }}-backend
  labels:
    {{- include "servicedesk.labels" . | nindent 4 }}
    app: servicedesk-backend
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    {{- include "servicedesk.backend.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.backend.port }}
      targetPort: http
      protocol: TCP
{{- if .Values.backend.compatibilityServiceName }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.backend.compatibilityServiceName }}
  labels:
    {{- include "servicedesk.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend-compat
spec:
  type: ClusterIP
  selector:
    {{- include "servicedesk.backend.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.backend.port }}
      targetPort: http
      protocol: TCP
{{- end }}
