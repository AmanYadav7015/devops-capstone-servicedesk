apiVersion: v1
kind: Service
metadata:
  name: {{ include "servicedesk.fullname" . }}-frontend
  labels:
    {{- include "servicedesk.labels" . | nindent 4 }}
    app: servicedesk-frontend
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    {{- include "servicedesk.frontend.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.frontend.port }}
      targetPort: http
      protocol: TCP
