databases:
  - name: servicedesk-db
    databaseName: servicedesk
    user: servicedesk
    plan: free

services:
  - type: web
    name: servicedesk-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: servicedesk-db
          property: connectionString
      - key: APP_NAME
        value: ServiceDesk API
      - key: PORT
        value: "8000"

  - type: web
    name: servicedesk-frontend
    runtime: docker
    plan: free
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8080"
      - key: NGINX_PORT
        value: "8080"
      - key: BACKEND_ORIGIN
        sync: false
