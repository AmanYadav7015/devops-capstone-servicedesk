resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  set $backend_origin "${BACKEND_ORIGIN}";

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri /index.html;
  }

  location /api/ {
    proxy_pass $backend_origin$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /health {
    proxy_pass $backend_origin/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location = /ready {
    proxy_pass $backend_origin/ready;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location = /metrics {
    proxy_pass $backend_origin/metrics;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }
}
